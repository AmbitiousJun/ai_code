<!doctype html>
<html lang="zh-CN">
  <meta charset="UTF-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>GameTrail · 游戏资源预热</title
  ><link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
  <header>
    <div class="brand"><b>↗</b> GameTrail <small id="version"></small></div>
    <span>本地资源预热工作台</span>
    <select id="theme" aria-label="界面主题"><option value="light">浅色</option><option value="dark">深色</option><option value="system">适应系统</option></select>
    <button class="secondary" id="quit">
      退出程序
    </button>
  </header>
  <main>
    <aside>
      <h2>任务配置</h2>
      <form id="form">
        <label
          >入口地址模板 <small>请将示例地址替换为实际入口</small><textarea
            required
            id="template"
            rows="3"
          ></textarea></label
        ><label
          >模板变量 <small>每行一个变量，多个值用逗号分隔。多变量回放按行从上到下展开，第一行的每个值依次跑完。</small
          ><textarea id="variables" rows="3"></textarea>
        </label>
        <label>主隔离变量<input id="primaryVariable" placeholder="例如 gameId" />
          <small>手动模式先完成各组录入，再回放所有组合。留空时各环境独立探索。</small></label>
        <fieldset>
          <legend>浏览环境</legend>
          <div id="devices"></div>
          <label>并发实例数<input type="number" min="1" step="1" id="replayConcurrency" />
            <small>适用于资源加载和路径重放。留空时使用任务勾选的浏览环境数。</small></label>
        </fieldset>
        <details>
          <summary>自定义机型与探索参数</summary>
          <label
            >自定义机型 JSON 数组<textarea
              id="custom"
              rows="4"
              placeholder='[{"id":"tablet","name":"平板","engine":"chromium","viewport":{"width":1024,"height":768},"hasTouch":true}]'
            ></textarea>
          </label>
          <label
            >页面加载等待上限（秒）<input
              id="waitSeconds"
              type="number"
              min="1"
              required /></label
          ><label
            >GET 静默窗口（秒）<input id="quietSeconds" type="number" min="0.1" max="30" step="0.1" /></label
          ><label
            >框选步骤等待超时（秒）<input id="pixelTimeout" type="number" min="1" max="120" required /></label
          ><label
            >截图初始最低相似度（%，每 10 秒依次降 1、1、2、2 个百分点，此后每次降 3 个百分点）<input id="pixelSimilarity" type="number" min="1" max="100" required /></label
          ><label
            >每环境最多尝试的函数数 / 按钮路径深度<input
              id="actions"
              type="number"
              min="0"
              max="40" /></label>
        </details>
        <label class="check"
          ><input
            id="explore"
            type="checkbox"
          />开启探索与重放</label
        >
        <div class="modeField"><label for="exploreMode-trigger">探索方式</label><select id="exploreMode">
          <option value="manual">手动录入特殊路径，再批量重放</option>
          <option value="source">分析源码，直接调用 iframe 函数</option>
          <option value="buttons">按按钮深度优先探索</option>
        </select></div>
        <p id="estimate"></p>
        <button id="start">启动任务</button>
        <button type="button" class="secondary" id="stop" disabled>停止</button>
        <p id="err" role="alert"></p>
      </form>
      <hr />
      <h2>本地缓存</h2>
      <p id="usage"></p>
      <div class="inline">
        <input
          id="cap"
          aria-label="缓存容量 GiB"
          type="number"
          min="0"
          step="any"
        /><span>GiB</span><button class="secondary" id="save">保存</button
        ><button class="secondary" id="clear">清空</button>
      </div>
    </aside>
    <section>
      <div class="sectiontitle">
        <h1>运行监控</h1>
        <span id="status">待启动</span>
      </div>
      <div class="metrics">
        <article>
          <small>已运行环境</small><strong id="done">0 / 0</strong>
        </article>
        <article>
          <small>GET 200 资源</small><strong id="success">0</strong>
        </article>
        <article>
          <small>缓存命中次数</small><strong id="hits">0</strong>
        </article>
        <article>
          <small>请求异常次数</small><strong id="errors">0</strong>
        </article>
      </div>
      <div class="progressTrack"><progress id="progress" aria-label="任务进度" max="1" value="0"></progress><span aria-hidden="true"></span></div>
      <p id="active">等待任务启动</p>
      <p id="paths"></p>
      <section id="manual" hidden aria-label="手动路径录入">
        <h2 id="manualTitle"></h2>
        <p id="manualNote" role="status"></p>
        <div id="manualControls"></div>
      </section>
      <details id="preview" open hidden>
        <summary>实时窗口预览</summary>
        <div id="screens" aria-label="运行实例预览"></div>
      </details>
      <div class="sectiontitle">
        <h2>请求时间线</h2>
        <select id="filter" aria-label="事件筛选">
          <option value="">全部事件</option>
          <option value="bad">异常</option>
          <option value="action">探索动作</option>
          <option value="frame">iframe</option>
          <option value="cacheDecision">缓存写入与跳过</option>
          <option value="cache">缓存命中</option>
        </select>
      </div>
      <div class="log">
        <table>
          <thead>
            <tr>
              <th>北京时间</th>
              <th>状态</th>
              <th>请求 / 事件</th>
            </tr>
          </thead>
          <tbody id="events"></tbody>
        </table>
      </div>
      <h2>已保存的重放任务</h2>
      <div id="replayTools" hidden>
        <label class="check"><input type="checkbox" id="allReplays" />全选</label>
        <button id="deleteReplays" class="secondary" disabled>删除所选任务</button>
      </div>
      <div id="replays"></div>
      <dialog id="rerunDialog" aria-labelledby="rerunTitle">
        <form id="rerunForm">
          <h2 id="rerunTitle">全量重跑</h2>
          <p id="rerunName"></p>
          <p id="rerunHint"></p>
          <div id="rerunFields"></div>
          <fieldset id="rerecord" hidden><legend>重新录入特殊路径的分组</legend><small>勾选的分组会从入口重新录入。录入完毕后替换这些分组的旧路径。</small><div id="rerecordChoices"></div></fieldset>
          <p id="rerunError" role="alert"></p>
          <button type="button" id="rerunCancel" class="secondary">取消</button>
          <button type="submit" id="rerunStart">保存并从头重跑</button>
        </form>
      </dialog>
      <h2>任务报告</h2>
      <div id="reportTools" hidden>
        <label class="check"><input type="checkbox" id="selectAll" />全选</label>
        <button id="deleteReports" class="secondary" disabled>删除所选报告</button>
      </div>
      <div id="history"></div>
      <div id="report"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</html>
